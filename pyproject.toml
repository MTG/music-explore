[project]
name = "music-explore"
version = "1.0.0"
description = "Add your description here"
authors = [{ name = "Philip Tovstogan", email = "philip.tovstogan@upf.edu" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "annoy>=1.17.3",
    "click>=8.3.0",
    "flask>=3.1.2",
    "flask-caching>=2.3.1",
    "flask-sqlalchemy>=3.0.5",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "plotly<6",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "sqlalchemy<2",
    "tqdm>=4.67.1",
    "umap-learn>=0.5.9.post2",
    "werkzeug>=3.1.3",
]

[dependency-groups]
dev = [
    "prek>=0.2.12",
    "ruff>=0.14.3",
]
processing = ["essentia-tensorflow>=2.1b6.dev1389", "tinytag>=2.1.2"]

[tool.ruff]
line-length = 120
